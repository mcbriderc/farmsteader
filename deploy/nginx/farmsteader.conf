upstream farmsteader {
    server unix:/run/farmsteader/gunicorn.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Farm backups are restored through the web UI, and field/animal photos are
    # uploaded; the app enforces its own limits (FARMSTEADER_MAX_RESTORE_BYTES).
    client_max_body_size 2G;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /opt/farmsteader/current is a symlink swapped atomically on upgrade, so
    # static files always match the running code.
    location /static/ {
        alias /opt/farmsteader/current/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Uploads live outside the release directory so an upgrade cannot touch them.
    location /media/ {
        alias /var/lib/farmsteader/media/;
        expires 7d;
    }

    # Probes are frequent and uninteresting; keep them out of the access log.
    location = /healthz {
        access_log off;
        proxy_set_header Host $http_host;
        proxy_pass http://farmsteader;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Set, never appended: overwriting any client-supplied value is what
        # makes it safe for Django to trust this header (SECURE_PROXY_SSL_HEADER).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_pass http://farmsteader;
    }
}
