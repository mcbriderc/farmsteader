{% extends "base.html" %}
{% block title %}Delete Harvest — FarmSteader{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="bg-surface rounded-xl shadow-sm border border-gray-200 p-6">
    <h1 class="text-xl font-bold text-gray-900 mb-2">Delete Harvest Record</h1>
    <p class="text-gray-600 mb-4">Delete harvest of <strong>{{ record.crop_type.name }}</strong> from <strong>{{ record.field.name }}</strong> on {{ record.harvest_date }}?</p>
    <form method="post" class="flex gap-3">
      {% csrf_token %}
      <button type="submit" class="bg-danger hover:bg-danger-hover text-white font-medium py-2 px-4 rounded-lg transition">Delete</button>
      <a href="{% url 'crops:harvest_list' %}" class="bg-surface border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-2 px-4 rounded-lg transition">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
