{% extends "base.html" %}
{% block title %}Create Farm — FarmSteader{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center text-farm-700 mb-6">Create a New Farm</h1>

    <form method="post" class="bg-surface shadow-sm rounded-xl border border-gray-200 p-6 space-y-4">
      {% csrf_token %}

      <div>
        <label for="id_name" class="block text-sm font-medium text-gray-700 mb-1">Farm Name</label>
        <input type="text" name="name" id="id_name" required autofocus
               class="w-full rounded-lg border-gray-300 shadow-sm focus:border-farm-500 focus:ring-farm-500 text-sm px-3 py-2 border">
      </div>

      <button type="submit"
              class="w-full bg-accent hover:bg-accent-hover text-white font-medium py-2 px-4 rounded-lg transition">
        Create Farm
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-500">
      <a href="{% url 'accounts:farm_select' %}" class="text-farm-600 hover:text-farm-700 font-medium">Back to farm list</a>
    </p>
  </div>
</div>
{% endblock %}
