{% extends "base.html" %}
{% block title %}Login — FarmSteader{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center text-farm-700 mb-2">FarmSteader</h1>
    <p class="text-center text-gray-500 mb-6">Sign in to your account</p>

    <form method="post" class="bg-surface shadow-sm rounded-xl border border-gray-200 p-6 space-y-4">
      {% csrf_token %}

      {% if form.errors %}
      <div class="bg-red-50 text-red-700 text-sm rounded-lg p-3">
        Invalid username or password.
      </div>
      {% endif %}

      <div>
        <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" name="username" id="id_username" required autofocus
               class="w-full rounded-lg border-gray-300 shadow-sm focus:border-farm-500 focus:ring-farm-500 text-sm px-3 py-2 border">
      </div>

      <div>
        <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" id="id_password" required
               class="w-full rounded-lg border-gray-300 shadow-sm focus:border-farm-500 focus:ring-farm-500 text-sm px-3 py-2 border">
      </div>

      <button type="submit"
              class="w-full bg-accent hover:bg-accent-hover text-white font-medium py-2 px-4 rounded-lg transition">
        Sign In
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-500">
      Don't have an account?
      <a href="{% url 'accounts:register' %}" class="text-farm-600 hover:text-farm-700 font-medium">Register</a>
    </p>
  </div>
</div>
{% endblock %}
