{% extends "base.html" %}
{% load static %}
{% block title %}Field Map — FarmSteader{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'vendor/css/leaflet.css' %}">
<link rel="stylesheet" href="{% static 'vendor/css/leaflet.draw.css' %}">
{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl font-bold text-gray-900">Field Map</h1>
  <div class="flex gap-2">
    <a href="{% url 'land:field_list' %}" class="bg-surface border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-2 px-4 rounded-lg text-sm transition">
      List View
    </a>
    <a href="{% url 'land:field_create' %}" class="bg-accent hover:bg-accent-hover text-white font-medium py-2 px-4 rounded-lg text-sm transition">
      + Add Field
    </a>
  </div>
</div>

<div id="map" class="w-full rounded-xl border border-gray-200 shadow-sm" style="height: 70vh;"></div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'vendor/js/leaflet.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const map = L.map('map').setView([39.8283, -98.5795], 5);

  const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  });
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; Esri', maxZoom: 19,
  });
  street.addTo(map);
  L.control.layers({'Street': street, 'Satellite': satellite}).addTo(map);

  // Load existing fields
  fetch('{% url "land:field_geojson" %}')
    .then(r => r.json())
    .then(data => {
      if (data.features.length === 0) return;

      const layer = L.geoJSON(data, {
        style: function(feature) {
          return {
            color: feature.properties.color,
            weight: 2,
            fillOpacity: 0.3,
          };
        },
        onEachFeature: function(feature, layer) {
          const p = feature.properties;
          layer.bindPopup(
            '<div class="text-sm">' +
            '<strong>' + p.name + '</strong><br>' +
            p.acreage + ' acres<br>' +
            '<a href="' + p.url + '" class="text-blue-600">View details &rarr;</a>' +
            '</div>'
          );
        },
      }).addTo(map);

      map.fitBounds(layer.getBounds().pad(0.1));
    });
});
</script>
{% endblock %}
